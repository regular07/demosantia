# Supabase (ucretsiz plan) 7 gun istek almazsa projeyi duraklatir.
# Bu is her gun REST API'ye gercek bir OKUMA istegi atarak projeyi uyanik tutar.
# Elle calistirmak icin: Actions sekmesi -> Supabase Keepalive -> Run workflow.
#
# Not: kullanilan anahtar "publishable" (js/04-api.js icinde zaten herkese acik),
# gizli degil. RLS sadece INSERT'e izin verdigi icin bu SELECT bos doner, yeterli.
#
# 2026-09-29 duzeltme: eski surum 401/403/404'u de "OK" sayiyordu. Bu, PostgREST'in
# proje uyanirken/soguk baslarken donen PGRST205 ("schema cache'de tablo yok", HTTP 404)
# ve PGRST002 ("schema cache icin veritabanina sorgu atilamadi", HTTP 503) yanitlarini da
# basari sayiyordu — ikisi de veritabanina GERCEKTEN dokunmuyor, sadece PostgREST'in kendi
# onbellek/baglanti durumunu yansitiyor. Sonuc: is "success" donuyordu ama bazi kosuşumlar
# veritabanini hic uyandirmiyordu; proje yine de 7 gunluk hareketsizlikten duraklatildi.
# Simdi sadece gercek 2xx (fiilen calisan bir SELECT) basari sayiliyor, diger her sey FAIL.

name: Supabase Keepalive

on:
  schedule:
    - cron: '17 6 * * *'   # her gun 06:17 UTC
  workflow_dispatch:        # elle tetikleme

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase REST'e gercek bir SELECT at
        run: |
          URL="https://avwxujnzaycatxkgflyn.supabase.co/rest/v1/quote_requests?select=id&limit=1"
          KEY="sb_publishable_2AypfknuSPcwL28RZbrsZQ_S89EoO5a"

          istek_at() {
            curl -s -o /tmp/resp.txt -w "%{http_code}" -m 30 \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL"
          }

          CODE=$(istek_at)
          echo "1. deneme: HTTP $CODE"
          cat /tmp/resp.txt
          echo

          # PGRST205 (404, schema cache'de tablo yok) ve PGRST002 (503, DB'ye
          # sorgu atilamadi) gibi gecici, veritabanina dokunmayan yanitlar icin
          # tek seferlik yeniden dene — cogu zaman PostgREST birkaç saniyede
          # cache'ini tazeler.
          case "$CODE" in
            404|503)
              echo "Gecici yanit (${CODE}), 10 sn sonra tekrar deneniyor..."
              sleep 10
              CODE=$(istek_at)
              echo "2. deneme: HTTP $CODE"
              cat /tmp/resp.txt
              echo
              ;;
          esac

          # SADECE gercek 2xx basaridir: PostgREST istegi veritabanina iletti ve
          # calistirdi (RLS satirlari filtrelese bile sorgu calisti sayilir).
          # Her sey digeri (401/403/404/5xx/000 dahil) FAIL — sessizce yutulmaz.
          case "$CODE" in
            2??) echo "OK — veritabanina gercek bir okuma yapildi"; exit 0 ;;
            *) echo "HATA — beklenen 2xx degil, proje uyanik/erisilebilir olmayabilir"; exit 1 ;;
          esac
